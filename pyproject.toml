[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-llm-backend"
version = "0.1.0"
description = "Local LLM backend server for the Dodger mobile/web app"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "RecursiveIntell" }
]
keywords = ["ai", "llm", "server", "ollama", "lmstudio", "openai"]

dependencies = [
    # Server
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    
    # LangChain Core
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    
    # LangChain Providers
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-google-genai>=2.0.0",
    
    # Configuration & Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Async HTTP
    "httpx>=0.27.0",
    
    # Structured Logging
    "structlog>=24.1.0",
    
    # Utilities
    "rich>=13.7.0",
    
    # Web Search
    "ddgs>=6.0.0",
]

[project.scripts]
dodger-server = "dodger.server.api:run_server"

[project.urls]
Homepage = "https://github.com/RecursiveIntell/local-llm-backend"
Repository = "https://github.com/RecursiveIntell/local-llm-backend"

[tool.hatch.build.targets.wheel]
packages = ["src/dodger"]

[tool.hatch.build.targets.sdist]
include = ["src/dodger"]
